[project]
name = "adversarial-aml-arena"
version = "0.1.0"
description = "Adversarial Fraud & AML Detection Arena - a closed-loop arms race between an AML detector and a genetic-algorithm adversary"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "deap>=1.4",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.33",
    "shap>=0.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jupyter>=1.0", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
